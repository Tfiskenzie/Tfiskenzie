<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Onyedika Okezie — Creative Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ================= SKELETON LOADER ================= */
#skeleton{
  position:fixed;
  inset:0;
  background:#F5F2EA;
  z-index:9999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  transition:opacity .8s ease, visibility .8s ease;
}

.skel{
  width:240px;
  height:10px;
  background:linear-gradient(90deg,#e6e1d8,#f5f2ea,#e6e1d8);
  background-size:200% 100%;
  animation:shine 1.2s infinite linear;
  border-radius:6px;
}

.skel.big{width:320px;height:14px}

@keyframes shine{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

#skeleton.hide{
  opacity:0;
  visibility:hidden;
}

/* ================= YOUR ORIGINAL CODE (UNCHANGED) ================= */

:root{
  --color-bg:#F5F2EA;
  --color-text:#1A1A1A;
  --color-border:#E0DDD4;
  --accent:#8A8A5C;

  --font-serif:"DM Serif Display", serif;
  --font-sans:"DM Sans", sans-serif;
  --font-mono:"IBM Plex Mono", monospace;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-sans);
  overflow-x:hidden;
  cursor:none;
}

/* CURSOR */
.cursor{
  width:12px;height:12px;
  border-radius:50%;
  background:var(--accent);
  position:fixed;
  top:0;left:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
}

/* ================= NAV ================= */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  backdrop-filter:blur(12px);
  background:rgba(245,242,234,.75);
  border-bottom:1px solid #E0DDD4;
}

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
}

.logo{
  font-family:var(--font-serif);
  font-size:1.1rem;
  letter-spacing:0.08em;
}

nav{
  display:flex;
  gap:28px;
  font-family:var(--font-mono);
  font-size:.85rem;
}

nav a{
  text-decoration:none;
  color:inherit;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0%;
  height:1px;
  background:var(--accent);
  transition:.3s ease;
}

nav a:hover::after{width:100%}

/* ================= HERO ================= */
.hero{
  padding:10rem 0 6rem;
  border-top:none;
}

/* ✨ HERO H1 FADE IN (NEW) */
.hero h1{
  font-family:var(--font-serif);
  font-size:clamp(2.8rem,5vw,4.2rem);
  line-height:1.05;
  margin-bottom:1.5rem;
  opacity:0;
  transform:translateY(20px);
  animation:heroFade .9s ease forwards;
  animation-delay:.3s;
}

@keyframes heroFade{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero p{
  max-width:600px;
  line-height:1.8;
  color:rgba(26,26,26,.75);
}

/* ================= SCROLL REVEAL (NEW) ================= */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:all .8s ease;
}

.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* ================= ABOUT ================= */
.about{
  padding:7rem 0;
  border-top:1px solid #E0DDD4;
}

.about h2{
  font-family:var(--font-serif);
  font-size:2.5rem;
  margin-bottom:1rem;
}

.about p{
  max-width:750px;
  line-height:1.8;
  color:rgba(26,26,26,.75);
  margin-bottom:1rem;
}

.about-grid{
  margin-top:2rem;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:1.5rem;
}

.about-box{
  padding:1.2rem;
  border:1px solid #E0DDD4;
  border-radius:10px;
  background:rgba(255,255,255,.2);
}

.about-box h4{
  font-family:var(--font-mono);
  font-size:.8rem;
  margin-bottom:.5rem;
  color:var(--accent);
}

/* OTHER SECTIONS */
section{
  padding:7rem 0;
  border-top:1px solid var(--color-border);
}

.container{
  max-width:960px;
  margin:0 auto;
  padding:0 1.5rem;
}

.project{
  display:grid;
  grid-template-columns:70px 1fr .8fr 2fr auto;
  gap:1rem;
  padding:1.5rem 0;
  border-bottom:1px solid var(--color-border);
}

.project-title{font-size:1.1rem}
.project:hover .project-title{color:var(--accent)}
.project-arrow{opacity:0;transition:.3s}
.project:hover .project-arrow{opacity:1}

.site-item{
  display:flex;
  justify-content:space-between;
  gap:2rem;
  padding:1.6rem 0;
  border-bottom:1px solid var(--color-border);
  flex-wrap:wrap;
}

.site-link{
  font-family:var(--font-mono);
  font-size:.78rem;
}

.ready{
  padding:8rem 0;
}

.ready h2{
  font-family:var(--font-serif);
  font-size:clamp(3rem,7vw,5rem);
  line-height:.95;
}

.ready a{
  display:inline-block;
  margin-top:2rem;
  font-size:1.2rem;
  text-decoration:none;
  color:inherit;
  border-bottom:1px solid var(--color-text);
}

.email-link{font-size:1.4rem}

</style>
</head>

<body>

<!-- SKELETON -->
<div id="skeleton">
  <div class="skel big"></div>
  <div class="skel"></div>
  <div class="skel"></div>
</div>

<div class="cursor"></div>

<header id="header">
  <div class="container header-inner">

    <a class="logo">KENZIE</a>

    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

  </div>
</header>

<main>

<!-- HERO -->
<section class="hero reveal">
  <div class="container">
    <h1>
      I design & build digital worlds for music, culture, brands, and internet-driven storytelling.
    </h1>
    <p>
      Creative developer focused on building expressive websites, brand systems, and interactive experiences rooted in culture.
    </p>
  </div>
</section>

<!-- WORK -->
<section id="work" class="reveal">
<div class="container">
<h2>Selected Work</h2>
...
</div>
</section>

<!-- ABOUT -->
<section id="about" class="about reveal">
<div class="container">
...
</div>
</section>

<!-- WEBSITES -->
<section class="reveal">
<div class="container">
...
</div>
</section>

<!-- READY -->
<section class="ready reveal">
<div class="container">
...
</div>
</section>

<!-- CONTACT -->
<section id="contact" class="reveal">
<div class="container">
...
</div>
</section>

</main>

<script>

/* CURSOR */
const cursor=document.querySelector(".cursor");
window.addEventListener("mousemove",(e)=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* HEADER */
const header=document.getElementById("header");
window.addEventListener("scroll",()=>{
  header.classList.toggle("scrolled",window.scrollY>10);
});

/* SKELETON */
window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("skeleton").classList.add("hide");
  },800);
});

/* ✨ SCROLL REVEAL */
const observer=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("active");
    }
  });
},{threshold:0.15});

document.querySelectorAll(".reveal").forEach(el=>{
  observer.observe(el);
});

</script>

</body>
</html>
